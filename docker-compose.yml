services:

  backend:
    build:
      context: ./be_audio_suka_shawarma
      dockerfile: Dockerfile

    environment:
      APP_NAME: "${APP_NAME}"
      APP_ENV: "${APP_ENV}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG}"
      APP_URL: "${APP_URL}"

      APP_LOCALE: "${APP_LOCALE}"
      APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE}"
      APP_FAKER_LOCALE: "${APP_FAKER_LOCALE}"

      BCRYPT_ROUNDS: "${BCRYPT_ROUNDS}"

      DB_CONNECTION: "${DB_CONNECTION}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"

      SESSION_DRIVER: "${SESSION_DRIVER}"
      SESSION_LIFETIME: "${SESSION_LIFETIME}"
      SESSION_ENCRYPT: "${SESSION_ENCRYPT}"
      SESSION_PATH: "${SESSION_PATH}"
      SESSION_DOMAIN: "${SESSION_DOMAIN}"

      CACHE_STORE: "${CACHE_STORE}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION}"
      FILESYSTEM_DISK: "${FILESYSTEM_DISK}"

      LOG_CHANNEL: "${LOG_CHANNEL}"
      LOG_STACK: "${LOG_STACK}"
      LOG_LEVEL: "${LOG_LEVEL}"

      JWT_SECRET: "${JWT_SECRET}"
      JWT_ALGO: "${JWT_ALGO}"
      JWT_TTL: "${JWT_TTL}"
      JWT_REFRESH_TTL: "${JWT_REFRESH_TTL}"

      BROADCAST_CONNECTION: "${BROADCAST_CONNECTION}"

      REVERB_APP_ID: "${REVERB_APP_ID}"
      REVERB_APP_KEY: "${REVERB_APP_KEY}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET}"
      REVERB_HOST: "${REVERB_HOST}"
      REVERB_PORT: "${REVERB_PORT}"
      REVERB_SCHEME: "${REVERB_SCHEME}"

      OCTANE_SERVER: "${OCTANE_SERVER}"

      FIREBASE_CREDENTIALS: "${FIREBASE_CREDENTIALS}"

    expose:
      - "8000"

    volumes:
      - ./be_audio_suka_shawarma/storage/app/firebase:/var/www/storage/app/firebase

    restart: unless-stopped


  reverb:
    build:
      context: ./be_audio_suka_shawarma
      dockerfile: Dockerfile

    command:
      - php
      - artisan
      - reverb:start
      - --host=0.0.0.0
      - --port=8080

    environment:
      APP_NAME: "${APP_NAME}"
      APP_ENV: "${APP_ENV}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG}"
      APP_URL: "${APP_URL}"

      DB_CONNECTION: "${DB_CONNECTION}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"

      CACHE_STORE: "${CACHE_STORE}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION}"

      BROADCAST_CONNECTION: "${BROADCAST_CONNECTION}"

      REVERB_APP_ID: "${REVERB_APP_ID}"
      REVERB_APP_KEY: "${REVERB_APP_KEY}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET}"
      REVERB_HOST: "${REVERB_HOST}"
      REVERB_PORT: "${REVERB_PORT}"
      REVERB_SCHEME: "${REVERB_SCHEME}"

      FIREBASE_CREDENTIALS: "${FIREBASE_CREDENTIALS}"

    expose:
      - "8080"

    volumes:
      - ./be_audio_suka_shawarma/storage/app/firebase:/var/www/storage/app/firebase

    restart: unless-stopped


  web:
    build:
      context: ./web_audio_suka_shawarma
      dockerfile: Dockerfile

    expose:
      - "80"

    restart: unless-stopped


  caddy:
    image: caddy:2-alpine

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - backend
      - reverb
      - web

    restart: unless-stopped


volumes:
  caddy_data:
  caddy_config: