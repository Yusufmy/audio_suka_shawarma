services:

  # ============================================================
  # LARAVEL BACKEND
  # ============================================================
  backend:
    build:
      context: ./be
      dockerfile: Dockerfile

    container_name: audio-backend

    env_file:
      - ./be/.env

    expose:
      - "8000"

    volumes:
      - ./be/storage/app/firebase:/var/www/storage/app/firebase

    networks:
      - audio-network

    restart: unless-stopped


  # ============================================================
  # LARAVEL REVERB
  # ============================================================
  reverb:
    build:
      context: ./be
      dockerfile: Dockerfile

    container_name: audio-reverb

    command: php artisan reverb:start --host=0.0.0.0 --port=8080

    env_file:
      - ./be/.env

    expose:
      - "8080"

    volumes:
      - ./be/storage/app/firebase:/var/www/storage/app/firebase

    networks:
      - audio-network

    restart: unless-stopped


  # ============================================================
  # REACT WEB
  # ============================================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile

    container_name: audio-shawarma-web

    expose:
      - "80"

    networks:
      - audio-network

    restart: unless-stopped


  # ============================================================
  # CADDY
  # ============================================================
  caddy:
    image: caddy:2-alpine

    container_name: audio-caddy

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

    networks:
      - audio-network

    depends_on:
      - backend
      - reverb
      - web


# ============================================================
# NETWORK
# ============================================================
networks:
  audio-network:
    driver: bridge


# ============================================================
# CADDY DATA
# ============================================================
volumes:
  caddy_data:
  caddy_config: